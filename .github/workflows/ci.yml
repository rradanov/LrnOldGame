name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Инсталиране (само devDependencies)
        run: npm ci

      - name: Валидиране на данните (каталог, курсове, manifest)
        run: |
          npm run validate-data
          node tools/validate-data/make-sample.js --check

      - name: Unit тестове
        run: npm run test:unit

      - name: Браузър за Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E тестове (Pixel 7)
        run: npm run test:e2e

      - name: Отчет от Playwright при грешка
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
