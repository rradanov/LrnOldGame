name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Инсталиране (само devDependencies)
        run: npm ci

      - name: Валидиране на данните (каталог, курсове, manifest)
        run: |
          npm run validate-data
          node tools/validate-data/make-sample.js --check

      - name: Unit тестове
        run: npm run test:unit

      - name: Браузър за Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E тестове (Pixel 7)
        run: npm run test:e2e

      - name: Отчет от Playwright при грешка
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
