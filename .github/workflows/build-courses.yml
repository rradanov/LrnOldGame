name: Build courses

# T-017 (ARCH_T-014 §1, §6, §8; D-007, D-013, D-014, D-019, D-022, D-024, D-025).
# lichess архив (поточно, спира след maxGames) → дърво → Stockfish 19 → data/courses/*.json +
# data/manifest.json → валидатор → commit в main (подразбиране) или PR (T018-D3: при забранен
# PR пада ясно и оставя клона — без мълчалив commit в main).
# T-022: job build е само с права за четене; публикуването е в отделен job publish (запис).
# Празен вход = стойността от tools/build-courses/config.json (за линиите) — така
# catalog.params на курса не се презаписва без нужда.
on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Месец от архива на lichess (YYYY-MM); празно = последният наличен'
        type: string
        default: ''
      maxGames:
        description: 'Приети партии, след които четенето спира (D-014)'
        type: string
        default: '4000000'
      minElo:
        description: 'Мин. рейтинг на двамата играчи'
        type: string
        default: '1200'
      maxElo:
        description: 'Макс. рейтинг на двамата играчи (0 = без граница)'
        type: string
        default: '1800'
      minBaseSec:
        description: 'Мин. базово време на часовника, сек. (180 = blitz и по-бавни)'
        type: string
        default: '180'
      treeMaxPly:
        description: 'Дълбочина на дървото, полуходове (≥ maxPly на линиите + 2)'
        type: string
        default: '28'
      courses:
        description: 'Курсове: all или id,id,… (празно = all)'
        type: string
        default: ''
      linesPerCourse:
        description: 'Линии на курс (празно = 20)'
        type: string
        default: ''
      advCpWhite:
        description: 'Праг на предимство за белите след рокада, cp (празно = 150; без рокада — advCpWhiteNoCastle 220)'
        type: string
        default: ''
      advCpBlack:
        description: 'Праг на предимство за черните след рокада, cp (празно = 60; без рокада — advCpBlackNoCastle 150)'
        type: string
        default: ''
      maxPly:
        description: 'Макс. полуходове на линия (празно = 26; ≤ treeMaxPly − 2)'
        type: string
        default: ''
      oppMinShare:
        description: 'Мин. дял на хода на противника (празно = 0.1)'
        type: string
        default: ''
      engineNodes:
        description: 'Възли на Stockfish на позиция (празно = 500000)'
        type: string
        default: ''
      overrides:
        description: 'JSON: секции tree, lines, engine (nodes, multiPV, workers, hashMb, timeoutMs, retries), cache; напр. {"lines":{"castleBonusCp":0,"rejectWeak":false,"tailOppMinGames":0},"engine":{"multiPV":4},"cache":{"use":false}}'
        type: string
        default: '{}'
      publish:
        description: 'Къде отиват данните: main (commit в main → CI → deploy), pr (клон + PR; пада, ако PR е забранен), none (само артефакт)'
        type: choice
        options: [main, pr, none]
        default: main

permissions:
  contents: read

concurrency:
  group: build-courses
  cancel-in-progress: false

env:
  SF_ASSET: stockfish-linux-x86-64-universal.tar.gz
  NODE_OPTIONS: --max-old-space-size=10240

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read   # npm ci и кодът на зависимостите вървят без права за запис (T018-D8.3)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Инсталиране
        run: |
          npm ci
          command -v zstd >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q zstd; }
          zstd --version
          echo "CPU: $(nproc) · RAM: $(free -g | awk '/Mem:/{print $2}') GB · диск: $(df -h . | awk 'NR==2{print $4}') свободни"
          echo "T0=$(date +%s)" >> "$GITHUB_ENV"

      - name: Месец и параметри
        id: prep
        env:
          INPUTS: ${{ toJSON(inputs) }}
          MONTH_IN: ${{ inputs.month }}
        run: |
          tpl=$(node -p "require('./tools/build-tree/config.json').source.urlTemplate")
          if [ -n "$MONTH_IN" ]; then
            # T018-D8.2: проверка преди да влезе в $GITHUB_OUTPUT
            [[ "$MONTH_IN" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]] || { echo "::error::month трябва да е YYYY-MM"; exit 2; }
            MONTH="$MONTH_IN"
          else
            # Архивът за месец M излиза в първите дни на M+1 → пробваме назад до 3 месеца.
            first=$(date -u +%Y-%m-01)
            for k in 1 2 3; do
              m=$(date -u -d "$first -$k month" +%Y-%m)
              if curl -sfIL -o /dev/null --max-time 30 --retry 2 "${tpl/\{month\}/$m}"; then MONTH=$m; break; fi
              echo "::notice::архивът за $m още го няма"
            done
            [ -n "${MONTH:-}" ] || { echo "::error::няма наличен месец в архива"; exit 1; }
          fi
          echo "url=${tpl/\{month\}/$MONTH}" >> "$GITHUB_OUTPUT"
          echo "sf_sha=$(node -p "require('./tools/build-courses/config.json').engine.sha256")" >> "$GITHUB_OUTPUT"
          MONTH="$MONTH" node tools/ci/prepare-inputs.js --out-dir build
          echo "--- build/tree-config.json"; cat build/tree-config.json
          echo "--- build/courses-inputs.json"; cat build/courses-inputs.json

      # ---------- Stockfish 19 (D-019): фиксирана версия, sha256 спрямо digest на релийза
      - name: Кеш на Stockfish
        id: sfcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/sf/${{ env.SF_ASSET }}
          key: sf-19-${{ steps.prep.outputs.sf_sha }}

      - name: Stockfish 19 (сваляне, sha256, bench)
        id: sf
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(node -p "require('./tools/build-courses/config.json').engine.url")
          want=$(node -p "require('./tools/build-courses/config.json').engine.sha256")
          ver=$(node -p "require('./tools/build-courses/config.json').engine.version")
          tag="sf_${ver}"
          digest=$(gh api "repos/official-stockfish/Stockfish/releases/tags/$tag" \
            --jq ".assets[] | select(.name == \"$SF_ASSET\") | .digest // empty" 2>/dev/null || true)
          echo "config sha256: $want"
          echo "релийз $tag digest: ${digest:-<няма>}"
          if [ -n "$digest" ]; then
            [ "$digest" = "sha256:$want" ] || { echo "::error::sha256 в config ($want) ≠ digest на релийза ($digest)"; exit 1; }
            echo "digest_check=съвпада с digest на релийза" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::релийзът не дава digest — проверката е само спрямо фиксираната стойност в config.json"
            echo "digest_check=само спрямо config.json (релийзът не дава digest)" >> "$GITHUB_OUTPUT"
          fi
          mkdir -p build/sf
          if [ ! -f "build/sf/$SF_ASSET" ]; then
            curl -sSfL --retry 3 --retry-all-errors -o "build/sf/$SF_ASSET" "$url"
          fi
          echo "$want  build/sf/$SF_ASSET" | sha256sum -c
          tar -xzf "build/sf/$SF_ASSET" -C build/sf
          SF="$PWD/build/sf/$(node -p "require('./tools/build-courses/config.json').engine.binary")"
          [ -x "$SF" ] || { echo "::error::няма binary $SF"; ls -R build/sf | head -50; exit 1; }
          echo "path=$SF" >> "$GITHUB_OUTPUT"
          bench=$("$SF" bench 16 1 13 2>&1 | tail -5)
          echo "$bench"
          nps=$(echo "$bench" | awk -F: '/Nodes\/second/{gsub(/ /,"",$2); print $2}')
          echo "nps=$nps" >> "$GITHUB_OUTPUT"

      # ---------- Дърво (T-004): кеш tree-<month>-<hash>, иначе поточно от lichess
      - name: Кеш на дървото
        id: treecache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tree.jsonl.gz
          key: tree-${{ steps.prep.outputs.month }}-${{ steps.prep.outputs.tree_hash }}-${{ hashFiles('tools/build-tree/**', 'src/chess/**', 'vendor/chess.js/**') }}

      - name: Дърво от lichess
        if: steps.treecache.outputs.cache-hit != 'true'
        env:
          URL: ${{ steps.prep.outputs.url }}
          MONTH: ${{ steps.prep.outputs.month }}
        run: |
          # Нарочното спиране след maxGames затваря stdin: zstd умира със SIGPIPE (141),
          # curl — с write error (23); zstd понякога връща 70 (write error) вместо 141. Важен е кодът на node (D-014; отчет T-004).
          set +e
          set -o pipefail
          t0=$(date +%s)
          # Без --retry: повтор по средата на поток към stdout би вмъкнал данните отначало (T018-D8.7).
          curl -sSL --retry 0 -w '%{stderr}curl: изтеглени %{size_download} B за %{time_total} s (%{speed_download} B/s)\n' "$URL" 2> build/curl.log \
            | zstd -dc 2> build/zstd.log \
            | /usr/bin/time -v -o build/tree-time.txt \
                node tools/build-tree --config build/tree-config.json --month "$MONTH" --out build/tree.jsonl.gz
          st=("${PIPESTATUS[@]}")
          set -e
          set +o pipefail
          echo "PIPESTATUS: curl=${st[0]} zstd=${st[1]} node=${st[2]} · $(( $(date +%s) - t0 )) s"
          cat build/curl.log; cat build/zstd.log
          grep -E 'Maximum resident|Elapsed' build/tree-time.txt || true
          [ "${st[2]}" -eq 0 ] || { echo "::error::build-tree завърши с ${st[2]}"; exit 1; }
          stopped=$(zcat build/tree.jsonl.gz 2>/dev/null | head -1 | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).stats.stoppedBy))')
          echo "stoppedBy=$stopped"
          if [ "$stopped" = "maxGames" ]; then
            case "${st[0]}" in 0|23|141) ;; *) echo "::warning::curl завърши с ${st[0]} след maxGames";; esac
            case "${st[1]}" in 0|1|70|141) ;; *) echo "::warning::zstd завърши с ${st[1]} след maxGames";; esac
          else
            # Целият месец е прочетен: тогава curl и zstd трябва да са завършили чисто.
            [ "${st[0]}" -eq 0 ] && [ "${st[1]}" -eq 0 ] || { echo "::error::потокът прекъсна преди maxGames (curl=${st[0]} zstd=${st[1]})"; exit 1; }
            echo "::warning::месецът свърши преди maxGames"
          fi

      - name: Manifest на дървото
        run: |
          zcat build/tree.jsonl.gz 2>/dev/null | head -1 > build/tree-manifest.json || true
          ls -l build/tree.jsonl.gz
          node -e '
            const m = JSON.parse(require("fs").readFileSync("build/tree-manifest.json","utf8"));
            const s = m.stats, r = m.run;
            console.log(`месец ${m.source.month} · прочетени ${s.gamesRead} · приети ${s.gamesAccepted} · позиции ${s.nodes} · ходове ${s.moves} · stoppedBy ${s.stoppedBy}`);
            console.log(`отхвърлени ${JSON.stringify(s.rejected)} · lossy ${JSON.stringify(s.lossy)}`);
            console.log(`време ${r.seconds}s (четене ${r.readSeconds}s) · ${r.gamesPerSec} партии/s · ${r.workers} нишки · пик RSS ${r.peakRssMb} MB`);'

      # ---------- Линии (T-016) с кеш на оценките (D-024)
      - name: Кеш на оценките (възстановяване)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/cache
          key: evals-sf19-${{ github.run_id }}
          restore-keys: evals-sf19-

      - name: Курсове
        id: courses
        env:
          SF: ${{ steps.sf.outputs.path }}
          NPS: ${{ steps.sf.outputs.nps }}
        run: |
          ls -l build/cache 2>/dev/null || echo "кешът на оценките е празен"
          # --engine-nps: manifest.engine.nps от bench, независимо от кеша (T018-D5)
          /usr/bin/time -v -o build/courses-time.txt \
            node tools/build-courses --engine-path "$SF" --tree build/tree.jsonl.gz \
              --inputs "$(cat build/courses-inputs.json)" --report build/report.md --engine-nps "${NPS//[^0-9]/}"
          grep -E 'Maximum resident|Elapsed' build/courses-time.txt || true
          ls -l build/cache
          # T-030: отчетът и в лога (артефактът не винаги е достъпен — напр. през proxy)
          echo "--- build/report.md"; cat build/report.md

      - name: Кеш на оценките (запис)
        if: always() && hashFiles('build/cache/*') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/cache
          key: evals-sf19-${{ github.run_id }}

      - name: Валидатор и тестове
        run: |
          npm run validate-data
          node tools/validate-data/make-sample.js --check
          npm run test:unit

      - name: Обобщение
        if: always()
        env:
          NPS: ${{ steps.sf.outputs.nps }}
          DIGEST: ${{ steps.sf.outputs.digest_check }}
        run: |
          {
            echo "## Build courses — run ${{ github.run_id }}"
            echo
            echo "- Месец: ${{ steps.prep.outputs.month }} · maxGames ${{ steps.prep.outputs.max_games }} · дърво от кеша: ${{ steps.treecache.outputs.cache-hit == 'true' && 'да' || 'не' }}"
            echo "- Stockfish bench (1 нишка): ${NPS:-?} nps · sha256: ${DIGEST:-?}"
            echo "- Общо време на job-а до тук: $(( $(date +%s) - ${T0:-$(date +%s)} )) s"
            [ -f build/curl.log ] && echo "- $(cat build/curl.log | tail -1)"
            for f in build/tree-time.txt build/courses-time.txt; do
              [ -f "$f" ] && echo "- $(basename "$f" .txt): $(grep -E 'Maximum resident' "$f" | sed 's/^\s*//') · $(grep -E 'Elapsed' "$f" | sed 's/^\s*//')"
            done
            if [ -f data/manifest.json ]; then
              echo "- Курсове: $(ls data/courses | wc -l) файла · $(cat data/courses/*.json | wc -c) B JSON · $(cat data/courses/*.json | gzip -9 | wc -c) B gzip (сумарно)"
            fi
            echo
            [ -f build/report.md ] && cat build/report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Артефакт (report, tree manifest)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-courses-${{ github.run_id }}
          path: |
            build/report.md
            build/tree-manifest.json
            build/tree-config.json
            build/courses-inputs.json
            build/*-time.txt
            build/curl.log
            data/manifest.json
            data/courses/*.json
          retention-days: 7
          if-no-files-found: warn

  # ---------- Публикуване (отделен job с права за запис; данните идват от артефакта на build)
  publish:
    needs: build
    if: inputs.publish != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write   # gh workflow run ci.yml / deploy.yml — push с GITHUB_TOKEN не пуска CI сам
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Данните от build
        run: rm -f data/courses/*.json

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: build-courses-${{ github.run_id }}
          path: .

      # T023-D5.1: валидаторът и data-quality тестовете са без зависимости (без npm ci) —
      # повторна проверка на данните от артефакта преди commit/push.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Публикуване
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ls data/courses | wc -l
          # T023-D5.1/D5.2: валидатор + data-quality; каталогът в работното дърво трябва да е
          # същият, с който са генерирани данните (иначе book тестовете стават мълчаливо skip).
          check_data() {
            local want have
            want=$(jq -r '.generator.catalogSha256 // empty' data/manifest.json)
            have=$(sha256sum data/catalog.json | cut -d' ' -f1)
            if [ "$want" != "$have" ]; then
              echo "::error::data/catalog.json ($1) е различен от каталога на генерирането (catalogSha256 $want ≠ $have) — пусни генерирането наново"; return 1
            fi
            node tools/validate-data || { echo "::error::валидаторът отхвърли данните ($1)"; return 1; }
            node --test tests/unit/data-quality.test.mjs || { echo "::error::data-quality тестовете паднаха ($1)"; return 1; }
          }
          check_data 'преди commit' || exit 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/manifest.json data/courses
          if git diff --cached --quiet; then echo "::notice::няма промени в данните"; exit 0; fi
          dv=$(jq -r .dataVersion data/manifest.json)
          git commit -q -m "Данни: курсове ${dv} (build-courses run ${{ github.run_id }})" -m "$RUN_URL"
          { echo "Генерирано от [build-courses run ${{ github.run_id }}]($RUN_URL)."; echo; cat build/report.md; } | head -c 60000 > build/pr-body.md

          # Пуска workflow и връща id на run-а. `gh workflow run` невинаги дава URL — тогава
          # търсим dispatch run, създаден след момента на пускането (T018-D8.8: без чужд run).
          dispatch() {
            local wf=$1 ref=$2 since out id=''
            since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            out=$(gh workflow run "$wf" --ref "$ref" 2>&1) || { echo "$out" >&2; return 1; }
            echo "$out" >&2
            id=$(echo "$out" | grep -oE '/runs/[0-9]+' | tail -1 | cut -d/ -f3 || true)
            for _ in 1 2 3 4 5 6; do
              [ -n "$id" ] && break
              sleep 10
              id=$(gh run list --workflow "$wf" --branch "$ref" --event workflow_dispatch -L 10 --json databaseId,createdAt \
                --jq "[.[] | select(.createdAt >= \"$since\")] | last | .databaseId // empty")
            done
            [ -n "$id" ] && echo "$id"
          }

          if [ "$PUBLISH" = main ]; then
            git fetch -q origin main
            git rebase -q origin/main
            check_data 'след rebase върху origin/main' || exit 1
            git push origin HEAD:main
            # Push с GITHUB_TOKEN не пуска CI, а CI, пуснат с GITHUB_TOKEN, не пуска deploy
            # (workflow_run) — затова: CI → изчакване → deploy → изчакване, всичко с workflow_dispatch.
            ci=$(dispatch ci.yml main) || { echo "::error::данните ${dv} са в main, но CI не можа да се пусне"; exit 1; }
            if ! gh run watch "$ci" --interval 15 --exit-status > /dev/null; then
              echo "::error::данните ${dv} са в main, но CI ($ci) падна — deploy не е пуснат"; exit 1
            fi
            dep=$(dispatch deploy.yml main) || { echo "::error::CI ($ci) е зелен, но deploy не можа да се пусне"; exit 1; }
            # T018-D8.5: статусът на job-а следва и deploy
            if ! gh run watch "$dep" --interval 15 --exit-status > /dev/null; then
              echo "::error::данните ${dv} са в main и CI ($ci) е зелен, но deploy ($dep) падна — пусни Deploy to GitHub Pages ръчно"; exit 1
            fi
            echo "::notice::данните ${dv} са в main; CI ($ci) ✓, deploy ($dep) ✓"
            echo "- Публикувано: commit в main (${dv}); CI $ci ✓; deploy $dep ✓" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # publish=pr (T018-D3): без fallback. Ако PR е забранен — грешка, клонът остава.
          branch="data/update-${{ github.run_id }}"
          git push -q origin "HEAD:refs/heads/$branch"
          if pr=$(gh pr create --base main --head "$branch" --title "Данни: курсове ${dv}" --body-file build/pr-body.md 2>build/pr-err.txt); then
            echo "::notice::PR: $pr"
            echo "- Публикувано: PR $pr" >> "$GITHUB_STEP_SUMMARY"
            dispatch ci.yml "$branch" > /dev/null || echo "::warning::CI не можа да се пусне за $branch"
          else
            cat build/pr-err.txt
            echo "::error::PR не може да се създаде. Данните са в клона $branch (НЕ са в main). Или включи Settings → Actions → General → Workflow permissions → Allow GitHub Actions to create and approve pull requests и пусни отново, или пусни с publish=main."
            echo "- НЕ е публикувано: PR е забранен; клон $branch" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
