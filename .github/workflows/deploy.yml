name: Deploy to GitHub Pages

# Деплой само след успешен CI в main (D-011): на push или ръчно пуснат CI. Run, пуснат с
# GITHUB_TOKEN, не задейства workflow_run — затова build-courses.yml сам пуска CI и после deploy.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Сглобяване на сайта (_site)
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --short HEAD)"
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js styles icons src vendor data LICENSE THIRD_PARTY.md _site/
          # Нов BUILD при всеки деплой → нов кеш в SW и подкана „Обнови“.
          sed -i "s/const BUILD = 'dev';/const BUILD = '${SHA}';/" _site/sw.js _site/src/version.js
          grep -q "const BUILD = '${SHA}';" _site/sw.js
          grep -q "const BUILD = '${SHA}';" _site/src/version.js
          touch _site/.nojekyll
          echo "Build ${SHA}"; du -sh _site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Деплой
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # deploy-pages понякога не вижда току-що каченото github-pages („Found 0 artifact(s)“,
      # 2 от 5 пускания на 2026-11-25) — изчакваме и пробваме още веднъж.
      - name: Пауза преди повтор
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - name: Деплой (повтор)
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
