<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <!-- T013-D8: само собствен origin, без inline скриптове. style-src-attr 'unsafe-inline' е нужен само за
       атрибута style на влачената фигура в cm-chessboard (VisualMoveInput); <style> елементи не се разрешават. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6b4f" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161a17" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Лично приложение за учене на шахматни дебюти">
  <title>LrnOldGame</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="vendor/cm-chessboard/assets/chessboard.css">
  <link rel="stylesheet" href="vendor/cm-chessboard/assets/extensions/markers/markers.css">
  <link rel="stylesheet" href="vendor/cm-chessboard/assets/extensions/arrows/arrows.css">
  <link rel="stylesheet" href="styles/app.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <div id="update-bar" class="update-bar" role="status" hidden></div>
  <main id="screen" class="screen" aria-live="polite"></main>
  <nav id="tabs" class="tabs" aria-label="Раздели"></nav>
  <noscript>Приложението изисква JavaScript.</noscript>
</body>
</html>
